            const pending = data.filter(item => item.status === 'provisorio').length;
            const allBounds = L.latLngBounds(markers.map(marker => marker.getLatLng()));
            const Control = L.Control.extend({
                options: {position: 'topright'},
                onAdd: function () {
                    const box = L.DomUtil.create('section', 'forum-panel');
                    box.setAttribute('aria-label', 'Busca de locais mapeados');
                    box.innerHTML = `
                        <div class="eyebrow">SANTA CATARINA</div>
                        <h1>Fóruns de Santa Catarina</h1>
                        <p class="counter"></p>
                        <p class="note"></p>
                        <label for="forum-search">Buscar local</label>
                        <input id="forum-search" type="search" autocomplete="off"
                            placeholder="Nome ou município">
                        <p class="search-state" role="status" aria-live="polite"></p>
                        <div class="results" aria-label="Resultados da busca"></div>
                        <button class="show-all" type="button">Mostrar todos os pontos</button>
                    `;
                    const counter = box.querySelector('.counter');
                    counter.textContent = data.length + ' locais mapeados' +
                        (pending ? ' — em conferência' : '');
                    box.querySelector('.note').textContent =
                        'Cadastro em revisão: os pontos não representam uma lista oficial completa. ' +
                        pending + ' localizações provisórias.';
                    const input = box.querySelector('input');
                    const results = box.querySelector('.results');
                    const state = box.querySelector('.search-state');
                    function normalize(value) {
                        return value.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
                    }
                    function showAll() {
                        map.closePopup();
                        const size = map.getSize();
                        const reserve = Math.min(box.offsetWidth + 35, size.x * 0.4);
                        map.fitBounds(allBounds, {
                            paddingTopLeft: [35, 35],
                            paddingBottomRight: [reserve, 45],
                            maxZoom: 17
                        });
                    }
                    function search() {
                        results.replaceChildren();
                        const query = normalize(input.value.trim());
                        if (!query) {
                            state.textContent = 'Digite para localizar um ponto. A busca aceita nomes sem acentos.';
                            return;
                        }
                        const matches = data.map((item, index) => ({item, index})).filter(entry =>
                            normalize(entry.item.nome + ' ' + entry.item.municipio).includes(query)
                        );
                        state.textContent = matches.length ? matches.length + ' resultado(s).' : 'Nenhum local encontrado.';
                        matches.forEach(({item, index}) => {
                            const button = document.createElement('button');
                            button.type = 'button';
                            button.className = 'result';
                            const name = document.createElement('strong');
                            name.textContent = item.nome;
                            const city = document.createElement('small');
                            city.textContent = item.municipio;
                            button.append(name, city);
                            button.addEventListener('click', () => {
                                const marker = markers[index];
                                map.setView(marker.getLatLng(), 17, {animate: false});
                                marker.openPopup();
                            });
                            results.appendChild(button);
                        });
                    }
                    input.addEventListener('input', search);
                    input.addEventListener('keydown', event => {
                        if (event.key === 'Enter') {
                            const first = results.querySelector('button');
                            if (first) first.click();
                        }
                        if (event.key === 'Escape') {input.value = ''; search();}
                    });
                    box.querySelector('.show-all').addEventListener('click', () => {
                        input.value = '';
                        search();
                        showAll();
                    });
                    L.DomEvent.disableClickPropagation(box);
                    L.DomEvent.disableScrollPropagation(box);
                    search();
                    return box;
                }
            });
            new Control().addTo(map);
        })();
